###############################################################################
# Общие настройки для всех сайтов.
#
# Файлы conf.d/*.conf подключаются внутрь http{}, поэтому директивы уровня http
# живут здесь, а не дублируются по server-блокам.
###############################################################################

# --- Сжатие ---
# Было выключено полностью: slotik.tech отдавал index.html 23 КБ и styles.css
# 14 КБ без сжатия. text/html gzip сжимает всегда, остальные типы — списком.
gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 256;
gzip_proxied any;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml
    application/rss+xml
    application/manifest+json
    image/svg+xml;
# woff2/png/jpeg уже сжаты — второй раз не трогаем.

# --- Переиспользование TLS-сессий ---
# Кеша не было, поэтому каждое новое соединение делало полный handshake — это и
# давало основную часть задержки до первого байта.
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1h;
ssl_session_tickets on;

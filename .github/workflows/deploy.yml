name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Sync files to server
        run: |
          rsync -avz --delete \
            --exclude='certbot/' \
            --exclude='.git' \
            ./ \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/reverse-proxy/

      - name: Restart containers and reload nginx
        run: |
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} bash -s << 'DEPLOY_SCRIPT'
            cd /opt/reverse-proxy

            docker network inspect shared-proxy >/dev/null 2>&1 || docker network create shared-proxy

            docker-compose down --remove-orphans
            docker-compose up -d

            echo "Checking nginx config..."
            docker-compose exec -T nginx nginx -t
            if [ $? -ne 0 ]; then
              echo "ERROR: nginx config is invalid, skipping reload"
              exit 1
            fi

            echo "Reloading nginx..."
            docker-compose exec -T nginx nginx -s reload
          DEPLOY_SCRIPT

      # certbot renew silently skips a lineage whose live/*.pem are regular files
      # instead of symlinks, so a single cert can expire while all the others keep
      # renewing. This re-issues only what is actually broken; on a healthy server
      # it makes no Let's Encrypt calls at all.
      - name: Ensure certificates are valid
        run: |
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            'cd /opt/reverse-proxy && bash scripts/ensure-certs.sh'

      # Proves renewal actually works, rather than assuming it does because the
      # certbot container is running. Uses the Let's Encrypt staging CA, so it
      # changes nothing and spends no production rate limit.
      - name: Verify auto-renewal
        run: |
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            'cd /opt/reverse-proxy && bash scripts/check-certs.sh'

      # These checks verify TLS as a browser would (no -k) and FAIL the job.
      # They used to end in `|| echo`, which is how an expired cert went unnoticed
      # for two months — and why severbus.ru/health returning 404 was never seen.
      - name: Health check
        run: |
          echo "Waiting for nginx to apply config..."
          sleep 5

          failed=0
          check() {
            local url="$1" expected="$2" code
            code="$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' "$url" 2>&1)" || {
              echo "FAIL  $url — TLS or connection error: $code"
              failed=1
              return
            }
            if [ "$code" = "$expected" ]; then
              echo "ok    $url ($code)"
            else
              echo "FAIL  $url — expected $expected, got $code"
              failed=1
            fi
          }

          check https://slotik.tech/health 200
          check https://admin.slotik.tech/ 200
          check https://severbus.ru/ 200
          check https://www.slotik.tech/ 301
          check https://www.severbus.ru/ 301

          if [ "$failed" -ne 0 ]; then
            echo "::error::Health check failed — see the failures above"
            exit 1
          fi
